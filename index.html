<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101118" />
    <!-- Resolves the theme before first paint. The attributes above are
         the no-JS fallback and the default for a first visit; this only
         overrides them when a returning visitor has actually chosen
         light. Without it the document paints dark and React swaps to
         light on mount, which shows as a flash on every cold load.

         The key is duplicated from KEY.theme in src/store/app.tsx — if
         that gets bumped again, bump it here too. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var saved = JSON.parse(localStorage.getItem('cd.theme.v6'))
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {
          /* private mode or a malformed value — keep the default */
        }
        document.documentElement.setAttribute('data-theme', theme)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#101118' : '#faf9f6')
      })()
    </script>
    <!-- This is a portfolio demo that carries a real business's name,
         phone number and course pricing. Keeping it out of search
         stops it competing with, or being mistaken for, the real
         cloudydata.in. Remove only if this becomes the actual site. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="CloudyData — affordable live training in Data Science, Data Analytics, Data Engineering and more. Learn by doing, with real projects and one-on-one mentorship."
    />
    <title>CloudyData — Learn by doing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One family at many weights, plus a mono for figures and labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314130f'/%3E%3Crect x='6' y='6' width='20' height='4' fill='%23d6210f'/%3E%3Crect x='6' y='14' width='20' height='2' fill='%23f2f0ea'/%3E%3Crect x='6' y='20' width='13' height='2' fill='%23f2f0ea'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
